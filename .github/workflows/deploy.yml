name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            jeanne/package-lock.json
            mori/package-lock.json

      - name: Install (jeanne)
        working-directory: jeanne
        run: npm ci

      - name: Test (jeanne)
        working-directory: jeanne
        run: npm test

      - name: Build (jeanne)
        working-directory: jeanne
        run: npm run build

      - name: Install (mori)
        working-directory: mori
        run: npm ci

      - name: Test (mori)
        working-directory: mori
        run: npm test

      - name: Build (mori)
        working-directory: mori
        run: npm run build

      # サイトの形: /index.html, /mori/（mori/dist の中身）, /jeanne/（jeanne/dist の中身）
      # /mori/next/ は作り直し版を試していたころの場所。ホーム画面に追加したリンクのために /mori/ へ移す
      - name: Assemble site
        run: |
          mkdir -p _site/jeanne _site/mori/next
          cp index.html _site/
          cp -R mori/dist/. _site/mori/
          cat > _site/mori/next/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=../">
          <script>location.replace('../');</script>
          <a href="../">もりの まもりびと へ</a>
          EOF
          cp -R jeanne/dist/. _site/jeanne/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
