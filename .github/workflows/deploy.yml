name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: jeanne/package-lock.json

      - name: Install (jeanne)
        working-directory: jeanne
        run: npm ci

      - name: Test (jeanne)
        working-directory: jeanne
        run: npm test

      - name: Build (jeanne)
        working-directory: jeanne
        run: npm run build

      # サイトの形: /index.html, /mori/, /jeanne/（jeanne/dist の中身）
      - name: Assemble site
        run: |
          mkdir -p _site/jeanne
          cp index.html _site/
          cp -R mori _site/mori
          cp -R jeanne/dist/. _site/jeanne/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
