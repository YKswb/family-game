name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            jeanne/package-lock.json
            mori/package-lock.json

      - name: Install (jeanne)
        working-directory: jeanne
        run: npm ci

      - name: Test (jeanne)
        working-directory: jeanne
        run: npm test

      - name: Build (jeanne)
        working-directory: jeanne
        run: npm run build

      - name: Install (mori)
        working-directory: mori
        run: npm ci

      - name: Test (mori)
        working-directory: mori
        run: npm test

      # 作り直し版は、今の版と入れ替えるまで /mori/next/ で試せるようにする
      - name: Build (mori)
        working-directory: mori
        run: npm run build -- --base /family-game/mori/next/

      # サイトの形: /index.html, /mori/（今の版）, /mori/next/（作り直し版）, /jeanne/（jeanne/dist の中身）
      - name: Assemble site
        run: |
          mkdir -p _site/jeanne _site/mori/next
          cp index.html _site/
          cp mori/legacy/index.html mori/public/apple-touch-icon.png _site/mori/
          cp -R mori/dist/. _site/mori/next/
          cp -R jeanne/dist/. _site/jeanne/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
