<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="もりのまもりびと">
<meta name="theme-color" content="#3d7431">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>もりの まもりびと</title>
<style>
  :root {
    --panel: #eefbe3; --ink: #1f4a22; --sub: #4f7a46; --btn: #ffcc1f; --btn-d: #d99a00; --btn-ink: #3a2a00; --chip: rgba(80, 160, 60, .14);
    --font: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Hiragino Sans", sans-serif;
  }
  html, body { margin: 0; height: 100%; background: #3d7431; overflow: hidden; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; -webkit-tap-highlight-color: transparent;
    font-family: var(--font); font-weight: 800; color: var(--ink); }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; }
  /* セーフエリアの大きさを読み取るためだけの見えない箱 */
  #safe { position: fixed; inset: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  /* 画面に重ねるボタン */
  .hudbtn { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right));
    width: 54px; height: 54px; border-radius: 16px; border: none; background: rgba(0, 0, 0, .3); color: #fff; font-size: 24px; cursor: pointer; }
  #callnow { position: fixed; right: calc(14px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom));
    font: inherit; font-size: 18px; padding: 13px 20px; border: none; border-radius: 18px;
    background: var(--btn); color: var(--btn-ink); box-shadow: 0 5px 0 var(--btn-d); cursor: pointer; }
  #callnow:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--btn-d); }
  /* 仲間への命令（いまの様子を小さく、押すとどうなるかを大きく） */
  #friendbtn { position: fixed; left: calc(14px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom));
    font: inherit; font-size: 18px; line-height: 1.25; padding: 8px 16px 10px; border: none; border-radius: 18px; text-align: left;
    background: #5aa0e8; color: #fff; box-shadow: 0 5px 0 #3a73b0; cursor: pointer; text-shadow: 0 1px 0 rgba(0, 0, 0, .25); }
  #friendbtn small { font-size: 13px; opacity: .92; }
  #friendbtn.guard { background: #e8935a; box-shadow: 0 5px 0 #b06a3a; }
  #friendbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #3a73b0; }
  .hide { display: none !important; }

  /* 選択・ひとやすみ・結果の画面 */
  #ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(15, 35, 12, .55);
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); box-sizing: border-box; }
  .card { background: var(--panel); color: var(--ink); border-radius: 30px; padding: 26px 22px 24px; max-width: 480px; width: 100%;
    text-align: center; box-shadow: 0 10px 0 rgba(0, 0, 0, .22); max-height: 100%; overflow: auto; touch-action: pan-y; box-sizing: border-box; }
  .title { font-size: clamp(28px, 7vw, 40px); margin: 0 0 6px; letter-spacing: .04em; }
  .lead { font-size: 18px; line-height: 1.7; margin: 0 0 14px; }
  .btns { display: grid; gap: 12px; justify-items: center; margin-top: 8px; }
  .btn { font: inherit; font-size: 23px; color: var(--btn-ink); background: var(--btn); border: none; border-radius: 22px;
    padding: 14px 40px; box-shadow: 0 6px 0 var(--btn-d); cursor: pointer; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--btn-d); }
  .stars { font-size: 52px; letter-spacing: 8px; margin: 6px 0 10px; color: #ffb400; }
  .opts { display: grid; gap: 10px; margin: 12px 0 4px; }
  .opt { font: inherit; display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 14px; border: none; border-radius: 18px;
    background: var(--chip); color: var(--ink); text-align: left; cursor: pointer; }
  .opt:active { transform: scale(.98); }
  .opt b { font-size: 34px; line-height: 1; flex: none; }
  .opt .name { font-size: 19px; display: block; }
  .opt .desc { font-size: 14px; color: var(--sub); display: block; margin-top: 2px; line-height: 1.5; font-weight: 700; }
  .hudbtn:focus-visible, .btn:focus-visible, .opt:focus-visible, #callnow:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .btn2 { font: inherit; font-size: 18px; color: var(--ink); background: transparent; border: 3px solid var(--sub); border-radius: 18px;
    padding: 10px 24px; cursor: pointer; }
  .btn:disabled, .btn2:disabled, .mini:disabled { opacity: .4; cursor: default; transform: none; }

  /* 会話の箱（画面の下。どこをタップしても次へ） */
  #dialog { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; background: rgba(15, 35, 12, .25);
    padding: 16px 16px calc(18px + env(safe-area-inset-bottom)); box-sizing: border-box; cursor: pointer; }
  #dialog .dlg { display: flex; align-items: center; gap: 14px; width: 100%; max-width: 760px; background: var(--panel); border-radius: 26px;
    padding: 16px 18px; box-shadow: 0 8px 0 rgba(0, 0, 0, .22); border: 4px solid #fff; box-sizing: border-box; }
  #dialog .face { flex: none; width: 72px; height: 72px; border-radius: 22px; display: grid; place-items: center; font-size: 44px;
    border: 4px solid #fff; box-shadow: 0 3px 0 rgba(0, 0, 0, .2); }
  #dialog .body { flex: 1; min-width: 0; }
  #dialog .who { font-size: 18px; margin-bottom: 4px; }
  #dialog .say { font-size: clamp(19px, 3.2vw, 24px); line-height: 1.55; color: var(--ink); }
  #dialog .more { flex: none; font-size: 26px; color: #e0a000; animation: bob 0.9s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(5px); } }

  /* タイトル・まもりびとの家・ステージ選び */
  #menu { position: fixed; inset: 0; overflow: auto; touch-action: pan-y; box-sizing: border-box;
    padding: calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    display: flex; flex-direction: column; align-items: center; }
  #menu .panel { width: 100%; max-width: 760px; margin: auto 0; background: var(--panel); border-radius: 30px; padding: 22px 20px 24px;
    box-shadow: 0 10px 0 rgba(0, 0, 0, .22); box-sizing: border-box; }
  #menu .logo { text-align: center; margin: auto 0; }
  #menu .logo h1 { font-size: clamp(40px, 9vw, 76px); margin: 0 0 4px; color: #fff; letter-spacing: .06em;
    text-shadow: 0 4px 0 #2b2116, 0 0 2px #2b2116, 3px 3px 0 #2b2116, -3px 3px 0 #2b2116, 3px -1px 0 #2b2116, -3px -1px 0 #2b2116; }
  #menu .logo p { font-size: 20px; color: #fff; margin: 0 0 26px; text-shadow: 0 2px 0 #2b2116, 2px 0 0 #2b2116, -2px 0 0 #2b2116, 0 -2px 0 #2b2116; }
  #menu .logo .btns { gap: 14px; }
  #menu .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  #menu .head h2 { margin: 0; font-size: clamp(24px, 5vw, 32px); }
  #menu .love { font-size: 22px; background: #ffe3ec; color: #b8325a; border-radius: 16px; padding: 6px 14px; white-space: nowrap; }
  #menu .group { margin: 14px 0 6px; font-size: 19px; display: flex; align-items: center; gap: 8px; }
  #menu .rows { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  #menu .row { display: flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 16px; padding: 10px 12px; }
  #menu .row b { font-size: 28px; flex: none; width: 36px; text-align: center; }
  #menu .row .txt { flex: 1; min-width: 0; }
  #menu .row .name { font-size: 17px; display: block; }
  #menu .row .desc { font-size: 14px; color: var(--sub); display: block; font-weight: 700; line-height: 1.4; }
  #menu .row .lv { font-size: 13px; color: #e0a000; letter-spacing: 2px; display: block; }
  .mini { font: inherit; font-size: 15px; flex: none; border: none; border-radius: 14px; padding: 8px 10px; min-width: 74px;
    background: var(--btn); color: var(--btn-ink); box-shadow: 0 4px 0 var(--btn-d); cursor: pointer; }
  .mini:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--btn-d); }
  #menu .note { font-size: 14px; color: var(--sub); margin: 6px 2px; font-weight: 700; }
  #menu .foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
  #menu .diff { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 4px 0 12px; }
  #menu .dbtn { font: inherit; font-size: 17px; padding: 8px 16px; border-radius: 14px; border: 3px solid var(--sub); background: transparent; color: var(--ink); cursor: pointer; }
  #menu .dbtn.on { background: var(--btn); border-color: var(--btn-d); color: var(--btn-ink); }
  #menu .stages { display: grid; gap: 10px; }
  #menu .sbtn { font: inherit; display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 14px; border: none; border-radius: 18px;
    background: var(--chip); color: var(--ink); font-size: 19px; text-align: left; cursor: pointer; }
  #menu .sbtn .sw { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #fff; font-size: 22px; flex: none;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .45); }
  #menu .sbtn .nm { flex: 1; }
  #menu .sbtn .st { color: #ffb400; font-size: 17px; letter-spacing: 1px; white-space: nowrap; }
</style>
</head>
<body>
  <div id="safe"></div>
  <div id="game"></div>
  <button id="pause" class="hudbtn hide" aria-label="ひとやすみ">⏸</button>
  <button id="callnow" class="hide"></button>
  <button id="friendbtn" class="hide"></button>
  <div id="menu" class="hide"></div>
  <div id="dialog" class="hide"></div>
  <div id="ov" class="hide"><div class="card" id="card"></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
