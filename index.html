<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="もりのまもりびと">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3d7431">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>もりの まもりびと</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#eefbe3; --ink:#1f4a22; --sub:#4f7a46; --btn:#ffcc1f; --btn-d:#d99a00; --btn-ink:#3a2a00; --bg:#3d7431; --chip:rgba(80,160,60,.14);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:#1d3320; --ink:#e8f7dc; --sub:#a9d39c; --bg:#22401c; --chip:rgba(140,220,120,.12); }
}
:root[data-theme="dark"]{ --panel:#1d3320; --ink:#e8f7dc; --sub:#a9d39c; --bg:#22401c; --chip:rgba(140,220,120,.12); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hudbtn{position:absolute;top:10px;width:50px;height:50px;border-radius:16px;border:none;background:rgba(0,0,0,.3);color:#fff;font-size:22px;cursor:pointer}
#mute{right:10px}
#pause{right:68px}
#callnow{position:absolute;right:14px;bottom:14px;font:inherit;font-weight:800;font-size:17px;padding:12px 18px;border:none;border-radius:18px;background:var(--btn);color:var(--btn-ink);box-shadow:0 5px 0 var(--btn-d);cursor:pointer}
#callnow:active{transform:translateY(3px);box-shadow:0 2px 0 var(--btn-d)}
.hudbtn:focus-visible,.btn:focus-visible,.btn2:focus-visible,.sbtn:focus-visible,.opt:focus-visible,.dbtn:focus-visible,#callnow:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,35,12,.55);padding:16px}
.ov.hide{display:none}
.card{background:var(--panel);color:var(--ink);border-radius:30px;padding:26px 22px 24px;max-width:460px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.22);max-height:100%;overflow:auto;touch-action:pan-y}
.title{font-size:clamp(28px,7vw,40px);font-weight:800;margin:0 0 6px;letter-spacing:.04em}
.lead{font-size:18px;line-height:1.7;margin:0 0 14px}
.steps{display:grid;gap:7px;margin:0 0 20px;text-align:left}
.step{display:flex;align-items:center;gap:12px;font-size:16px;background:var(--chip);border-radius:16px;padding:8px 14px}
.step b{font-size:24px;line-height:1}
.btns{display:grid;gap:12px;justify-items:center}
.btn{font:inherit;font-size:23px;font-weight:800;color:var(--btn-ink);background:var(--btn);border:none;border-radius:22px;padding:14px 40px;box-shadow:0 6px 0 var(--btn-d);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--btn-d)}
.btn2{font:inherit;font-size:18px;font-weight:800;color:var(--ink);background:transparent;border:3px solid var(--sub);border-radius:18px;padding:10px 26px;cursor:pointer}
.stars{font-size:52px;letter-spacing:8px;margin:6px 0 10px;color:#ffb400}
.stages{display:grid;gap:8px;margin:8px 0 16px}
.sbtn{font:inherit;display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;border:none;border-radius:16px;background:var(--chip);color:var(--ink);font-size:17px;font-weight:800;text-align:left;cursor:pointer}
.sbtn:disabled{opacity:.45;cursor:default}
.sw{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:19px;flex:none;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.sbtn .nm{flex:1}
.sbtn .st{color:#ffb400;font-size:15px;letter-spacing:1px;white-space:nowrap}
.diff{display:flex;gap:8px;justify-content:center;margin:6px 0 4px;flex-wrap:wrap}
.dbtn{font:inherit;font-weight:800;font-size:16px;padding:8px 14px;border-radius:14px;border:3px solid var(--sub);background:transparent;color:var(--ink);cursor:pointer}
.dbtn.on{background:var(--btn);border-color:var(--btn-d);color:var(--btn-ink)}
.small{font-size:13px;color:var(--sub);margin:4px 0 0}
.opts{display:grid;gap:10px;margin:12px 0 4px}
.opt{font:inherit;display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:none;border-radius:18px;background:var(--chip);color:var(--ink);text-align:left;cursor:pointer}
.opt:active{transform:scale(.98)}
.opt b{font-size:34px;line-height:1;flex:none}
.opt .on1{font-size:19px;font-weight:800;display:block}
.opt .d{font-size:14px;color:var(--sub);display:block;margin-top:2px;line-height:1.5}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <button id="pause" class="hudbtn" aria-label="ひとやすみ" style="display:none">⏸</button>
  <button id="mute" class="hudbtn" aria-label="おとの オン・オフ">🔊</button>
  <button id="callnow" style="display:none">⏩ すぐ よぶ</button>
  <div id="ov" class="ov"><div class="card" id="card"></div></div>
</div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),card=document.getElementById('card'),muteBtn=document.getElementById('mute'),pauseBtn=document.getElementById('pause'),callBtn=document.getElementById('callnow');
let W=0,H=0,DPR=1,S=1,U=1;
function resize(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.round(W*DPR));cv.height=Math.max(1,Math.round(H*DPR));
  S=Math.min(W,H)/580;U=Math.max(1,Math.min(1.6,Math.min(W,H)/420));}
addEventListener('resize',resize);resize();
// iPad: orientation changes / Split View can settle after the resize event fires
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);
addEventListener('orientationchange',()=>setTimeout(resize,250));

const FONT='"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';
const WORLD=1400,BX=700,BY=700,BASE_R=58,TAU=Math.PI*2,WR=215,TERR=[320,440,580];
const rand=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const COST={tower:[10,18,28],axe:[12,20,30],bag:[8,15,24],wall:[6,12],land:[20,35]};
const MAXLV={tower:3,axe:3,bag:3,wall:2,land:2};
const DIFF=[{name:'かんたん',hp:0.75,cnt:0.8,sp:0.95,base:40,prep:40,gap:22},{name:'ふつう',hp:1,cnt:1,sp:1,base:30,prep:30,gap:18},{name:'むずかしい',hp:1.35,cnt:1.25,sp:1.08,base:25,prep:25,gap:15}];
const ETYPE={
  slime:{hp:3,sp:40,r:16,dmg:1,col:'#9b7bf2',xp:1,drop:1},
  mini:{hp:1.5,sp:50,r:11,dmg:1,col:'#b9a2f7',xp:1,drop:0},
  goblin:{hp:7,sp:50,r:19,dmg:2,col:'#5cb85c',xp:2,drop:2},
  bat:{hp:2,sp:66,r:13,dmg:1,col:'#5b3f8f',fly:true,xp:1,drop:1},
  wolf:{hp:4,sp:88,r:15,dmg:1,col:'#8d96a3',xp:2,drop:1},
  knight:{hp:10,sp:34,r:19,dmg:2,col:'#7d8aa0',armor:true,xp:3,drop:3},
  splitter:{hp:8,sp:34,r:24,dmg:2,col:'#e07ad0',split:true,xp:2,drop:1},
  boss:{hp:45,sp:24,r:40,dmg:4,col:'#e0457b',xp:15,drop:10},
  maou:{hp:160,sp:20,r:48,dmg:6,col:'#4a2a6a',summon:true,xp:30,drop:20}};
const TW={
  arrow:{ic:'🏹',name:'やの とう',desc:'そらの てきにも あたる。はやく うつ',rg:[190,215,245],cd:[1.0,0.72,0.5],dmg:[1,1.3,2],air:true,col:'#3d7be0'},
  cannon:{ic:'💣',name:'たいほうの とう',desc:'まとめて ドカン！ よろいにも つよい。そらには とどかない',rg:[170,190,215],cd:[1.9,1.6,1.3],dmg:[3,4.5,6.5],air:false,splash:[50,58,66],col:'#5b6370'},
  ice:{ic:'❄️',name:'こおりの とう',desc:'てきを おそく する。かべと くみあわせると つよい',rg:[180,200,225],cd:[1.2,1.0,0.8],dmg:[0.5,0.7,1],air:true,slow:[1.8,2.4,3],col:'#6cc8f0'}};
const LABEL={axe:'おの',bag:'かばん',land:'ひろげる'};
const ICON={tower:'🏰',axe:'🪓',bag:'🎒',land:'🚩'};
const THEMES={
  spring:{ground:'#78c35f',tuft:['#69b552','#88cd6d'],flower:['#ffffff','#ffd84d','#ff9ec4'],leaf:['#2a8338','#3fa04a'],clear:'rgba(240,214,150,.75)',bg:'#3d7431',fog:'rgba(18,40,14,.6)'},
  autumn:{ground:'#a7c162',tuft:['#93ad52','#c2c870'],flower:['#ffb347','#e8603c','#ffffff'],leaf:['#d9662b','#f0a03a'],leaf2:['#b8392c','#dd5a3c'],clear:'rgba(236,206,140,.8)',bg:'#5f5a26',fog:'rgba(45,30,10,.6)'},
  snow:{ground:'#e8f1f6',tuft:['#d2e0ea','#f7fbfd'],flower:['#bfe3ff','#ffffff','#d2e0ea'],leaf:['#2f7a5a','#3f9070'],snow:true,clear:'rgba(214,200,170,.8)',bg:'#9fb7c6',fog:'rgba(40,60,85,.55)'},
  dusk:{ground:'#8fb35a',tuft:['#7f9f4c','#a9c46a'],flower:['#ffb347','#ff7ab0','#ffffff'],leaf:['#3b7a3a','#5a9a45'],clear:'rgba(236,200,140,.8)',bg:'#4a3a2a',fog:'rgba(50,20,30,.6)',tint:'rgba(255,110,50,.15)'},
  desert:{ground:'#e8d39a',tuft:['#d9bf7c','#f1e0ad'],flower:['#f0a03a','#ffffff','#e07a5a'],leaf:['#5f9a3a','#79b04a'],clear:'rgba(200,170,110,.55)',bg:'#b8975a',fog:'rgba(80,50,20,.5)'},
  swamp:{ground:'#6e8f5a',tuft:['#5f7f4c','#7f9f66'],flower:['#c9e86a','#ffffff','#b48ad8'],leaf:['#3f6a3a','#557f45'],leaf2:['#4a5f3a','#62784a'],clear:'rgba(160,150,110,.6)',bg:'#2f4a2a',fog:'rgba(20,35,25,.65)',tint:'rgba(60,90,40,.15)'},
  volcano:{ground:'#7a5a4a',tuft:['#6a4a3c','#8a6a58'],flower:['#ff7a3a','#ffb347','#ff5a3a'],leaf:['#4a6a2f','#5f7f3a'],clear:'rgba(150,120,95,.7)',bg:'#3a2420',fog:'rgba(40,10,5,.6)',tint:'rgba(255,60,20,.12)'},
  night:{ground:'#4f7a52',tuft:['#456d48','#5d8a5f'],flower:['#c8e6ff','#ffe98a','#ffffff'],leaf:['#1f5a3a','#2f6f48'],clear:'rgba(170,160,130,.7)',bg:'#14241a',fog:'rgba(5,10,25,.68)',tint:'rgba(20,25,80,.3)'}};
const THEME_ORDER=['spring','autumn','snow','desert','swamp','volcano','dusk','night'];
const ALLPOOL=[['slime',2,1],['goblin',2,1],['bat',2,1],['wolf',2,1],['knight',2,1],['splitter',1,1]];
const STAGES=[
  {name:'はじまりの もり',theme:'spring',waves:5,base:3,grow:2,pool:[['slime',1,1]],sw:'#5aa845'},
  {name:'あきの もり',theme:'autumn',waves:6,base:4,grow:2,pool:[['slime',3,1],['goblin',1,2],['wolf',1,4]],tip:'てんせんに たつと かべが できるよ',sw:'#e0802f'},
  {name:'ゆきの もり',theme:'snow',waves:6,base:5,grow:2,pool:[['slime',3,1],['goblin',1,1],['bat',1,2]],boss:'boss',tip:'こうもりは かべを とびこえる！',sw:'#6aa9cf'},
  {name:'ゆうやけの もり',theme:'dusk',waves:7,base:5,grow:3,pool:[['slime',3,1],['goblin',2,1],['bat',1,2],['wolf',1,2],['knight',1,3]],tip:'よろいの きしは たいほうに よわいよ',sw:'#f07a4a'},
  {name:'すなの さばく',theme:'desert',waves:7,base:6,grow:3,pool:[['slime',2,1],['goblin',2,1],['wolf',2,1],['knight',1,2],['splitter',1,2]],boss:'boss',tip:'ピンクの スライムは 2ひきに わかれる',sw:'#d9a94a'},
  {name:'きりの ぬまち',theme:'swamp',waves:7,base:6,grow:3,pool:[['splitter',2,1],['bat',2,1],['goblin',2,1],['knight',1,2],['wolf',1,3]],tip:'こおりの とうで てきを おそく しよう',sw:'#5f8a55'},
  {name:'ほのおの かざん',theme:'volcano',waves:8,base:7,grow:3,pool:[['slime',2,1],['goblin',2,1],['bat',2,1],['wolf',2,2],['knight',2,2],['splitter',1,3]],boss:'boss',tip:'レベルアップの えらびかたが かぎ！',sw:'#d9483a'},
  {name:'まおうの しろ',theme:'night',waves:8,base:8,grow:3,pool:ALLPOOL,boss:'maou',tip:'さいごに まおうが くるよ！',sw:'#3a4a8a'}];
const PERKS=[
  {id:'pdmg',ic:'⚔️',name:'こうげき アップ',d:'じぶんの こうげきが +1',max:4,f:m=>{m.pdmg+=1;}},
  {id:'chop',ic:'🪓',name:'はやぎり',d:'きを きる はやさ 25% アップ',max:3,f:m=>{m.chop*=0.8;}},
  {id:'speed',ic:'👟',name:'はやあし',d:'あるく はやさ アップ',max:3,f:m=>{m.speed+=0.12;}},
  {id:'bag',ic:'🎒',name:'おおきな ふくろ',d:'もてる もくざい +10',max:3,f:m=>{m.cap+=10;}},
  {id:'magnet',ic:'🧲',name:'じしゃく',d:'おちた もくざいを とおくから すいよせる',max:2,f:m=>{m.magnet+=0.7;}},
  {id:'tdmg',ic:'🏹',name:'とうの ちから',d:'ぜんぶの とうの こうげき 25% アップ',max:4,f:m=>{m.tdmg+=0.25;}},
  {id:'whp',ic:'🧱',name:'がんじょうな かべ',d:'かべの たいりょく 50% アップ',max:3,f:m=>{const r=(m.whp+0.5)/m.whp;m.whp+=0.5;for(const w of G.walls)if(w.lv>0){w.max*=r;w.hp*=r;}}},
  {id:'heal',ic:'💖',name:'おうちを なおす',d:'おうちの たいりょく +15（さいだいも +5）',max:99,f:()=>{G.base.max+=5;G.base.hp=Math.min(G.base.max,G.base.hp+15);}},
  {id:'area',ic:'🌀',name:'かいてん ぎり',d:'まわりの てき ぜんぶに こうげき',max:1,f:m=>{m.area=true;}},
  {id:'dbl',ic:'🍀',name:'ラッキー',d:'きを きると ときどき もくざい 2ばい',max:2,f:m=>{m.dbl+=0.3;}}];

/* ---------- sound ---------- */
let AC=null,muted=false,lastPick=0;
function initAudio(){try{
  // iOS: play through the media channel so sound isn't silenced by the ringer/silent setting
  if(navigator.audioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback';
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  // iOS reports 'interrupted' after switching apps, not just 'suspended'
  if(AC.state!=='running')AC.resume();}catch(e){}}
function sfx(f,d,type,v,f2,delay){if(!AC||muted)return;try{const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v||0.05,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function pickSound(){const n=performance.now();if(n-lastPick>45){lastPick=n;sfx(880,0.05,'sine',0.04,1200);}}
muteBtn.addEventListener('click',()=>{muted=!muted;muteBtn.textContent=muted?'🔇':'🔊';});

/* ---------- progress ---------- */
function loadProg(){let v=null;try{v=JSON.parse(localStorage.getItem('mori3_prog')||'null');}catch(e){}
  const d={unlocked:1,stars:Array(8).fill(0),crown:Array(8).fill(false),diff:1,endless:0};
  if(!v||typeof v!=='object')return d;
  for(const k in d){if(v[k]===undefined)v[k]=d[k];}
  while(v.stars.length<8)v.stars.push(0);while(v.crown.length<8)v.crown.push(false);return v;}
function saveProg(v){try{localStorage.setItem('mori3_prog',JSON.stringify(v));}catch(e){}}

/* ---------- state ---------- */
let G=null,running=false;
function mk(type,x,y){return{type,x:BX+x,y:BY+y,lv:0,paid:0,cd:0,feed:0.2,pulse:0,pop:0,near:false,hidden:false,hp:0,max:0,hit:0,kind:null};}
const RESERVED=[[300,0],[-300,0],[0,320],[0,-320],[0,280],[0,400]];
const xpNeed=l=>6+l*4;
function setTheme(key){G.th=THEMES[key];const th=G.th;
  G.tufts.forEach((t,i)=>t.c=th.tuft[i%2]);G.flowers.forEach((f,i)=>f.c=th.flower[i%3]);
  for(const t of G.trees)t.leaf=th.leaf2&&Math.random()<0.4?th.leaf2:th.leaf;}
function newGame(si,diff,endless){
  const st=endless?{name:'むげんモード',theme:'spring',waves:Infinity,tip:'どこまで まもれるかな？'}:STAGES[si];
  const D=DIFF[diff];
  G={si,st,diff,endless,th:THEMES[st.theme],t:0,state:'play',wave:0,maxWave:st.waves,phase:'prep',timer:D.prep,toSpawn:[],spawnT:0,dirs:[0],hpMul:1,
    tut:(si===0&&!endless)?0:3,base:{hp:D.base,max:D.base,hit:0},
    p:{x:BX,y:BY+95,wood:0,chopT:0,atkT:0,swing:0,face:1,step:0,moving:false,moved:0},
    m:{pdmg:0,chop:1,speed:1,cap:0,magnet:1,tdmg:1,whp:1,area:false,dbl:0},perkCount:{},lv:1,xp:0,modal:[],
    axeLv:0,bagLv:0,terrR:TERR[0],terrD:TERR[0],
    trees:[],enemies:[],spots:[],walls:[],shots:[],parts:[],texts:[],flyers:[],drops:[],
    tufts:[],flowers:[],shake:0,cam:{x:0,y:0},big:null};
  const th=G.th;
  for(let i=0;i<450;i++)G.tufts.push({x:Math.random()*WORLD,y:Math.random()*WORLD,s:rand(3,7),c:th.tuft[i%2]});
  for(let i=0;i<80;i++)G.flowers.push({x:Math.random()*WORLD,y:Math.random()*WORLD,c:th.flower[i%3]});
  let tries=0;
  while(G.trees.length<260&&tries<9000){tries++;
    const x=rand(40,WORLD-40),y=rand(60,WORLD-30);
    if(dist(x,y,BX,BY)<250)continue;
    if(RESERVED.some(([rx,ry])=>dist(x,y,BX+rx,BY+ry)<60))continue;
    if(G.trees.some(t=>dist(t.x,t.y,x,y)<52))continue;
    G.trees.push({x,y,hp:3,max:3,alive:true,regrow:0,shake:0,grow:1,sz:rand(0.9,1.12),leaf:th.leaf2&&Math.random()<0.4?th.leaf2:th.leaf});}
  [[-100,-100],[100,-100],[-100,100],[100,100]].forEach(([x,y])=>G.spots.push(mk('tower',x,y)));
  G.spots.push(mk('axe',150,0));G.spots.push(mk('bag',-150,0));
  G.land=mk('land',0,TERR[0]-40);G.spots.push(G.land);
  for(let i=0;i<8;i++){const a=(i+0.5)*TAU/8,s=mk('wall',Math.cos(a)*WR,Math.sin(a)*WR);s.ang=a;s.posts=[];
    for(let j=0;j<7;j++){const b=i*TAU/8+(j+0.5)*TAU/56;s.posts.push({x:BX+Math.cos(b)*WR,y:BY+Math.sin(b)*WR});}

function makeEnemy(type,x,y,hpMul){const st=ETYPE[type],hp=st.hp*hpMul;

    sp:st.sp*rand(0.9,1.1)*DIFF[G.diff].sp,r:st.r,dmg:st.dmg,col:st.col,atkT:0.5,hitF:0,kx:0,ky:0,bob:Math.random()*6,face:1,dead:false,slow:0};}
function hurt(e,dmg,fx,fy,src){
  if(e.dead)return;

    for(let i=0;i<e.drop;i++){const a=Math.random()*TAU,v=rand(30,90);G.drops.push({x:e.x,y:e.y,z:5,vz:rand(160,230),vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,got:false});}
    if(e.split)for(let i=0;i<2;i++)G.enemies.push(makeEnemy('mini',e.x+(i?16:-16),e.y+rand(-8,8),G.hpMul));
    if(e.type==='boss'){bigText('ボスを たおした！');G.shake=0.4;}

function hitWall(w,dmg){

function completeSpot(s){
  s.lv++;s.paid=0;s.pop=0.5;burst(s.x,s.y-30,'#ffd84d',22,230,5);

    else{G.spots.push(mk('tower',0,-320),mk('tower',0,320));s.hidden=true;}}
  else if(s.lv===1)G.modal.push({type:'tower',s});

function spawnEnemy(type){
  const a=G.dirs[Math.floor(Math.random()*G.dirs.length)]+rand(-0.45,0.45),R=660;
  let mul=G.hpMul;

  G.enemies.push(makeEnemy(type,clamp(BX+Math.cos(a)*R,30,WORLD-30),clamp(BY+Math.sin(a)*R,50,WORLD-20),mul));

function waveList(n){
  let cfg,boss=null;
  if(G.endless){cfg={base:5,grow:3,pool:[['slime',3,1],['goblin',2,2],['bat',2,3],['wolf',2,4],['knight',2,5],['splitter',2,6]]};
    if(n%10===0)boss='maou';else if(n%5===0)boss='boss';}
  else{cfg=G.st;if(n===G.maxWave)boss=cfg.boss||null;}
  const pool=cfg.pool.filter(p=>n>=p[2]),tot=pool.reduce((a,p)=>a+p[1],0);
  const cnt=Math.max(3,Math.round((cfg.base+n*cfg.grow)*DIFF[G.diff].cnt)),L=[];
  for(let i=0;i<cnt;i++){let r=Math.random()*tot,pick=pool[0][0];for(const p of pool){r-=p[1];if(r<=0){pick=p[0];break;}}L.push(pick);}
  shuffle(L);if(boss)L.push(boss);return L;
}
function startWave(){
  G.wave++;G.phase='fight';const n=G.wave,last=n===G.maxWave;
  G.hpMul=DIFF[G.diff].hp*(G.endless?(1+0.07*(n-1)):(1+0.04*(n-1)+0.04*G.si));
  G.toSpawn=waveList(n);G.spawnT=0.5;
  let nd=1;
  if(G.endless)nd=n>=12?3:n>=4?2:1;
  else{if(G.si>=1&&n>=3)nd=2;if(G.si>=3&&n>=2)nd=2;if(G.si>=5&&n>=5)nd=3;}
  const a=Math.random()*TAU;G.dirs=[];for(let i=0;i<nd;i++)G.dirs.push(a+i*TAU/nd+rand(-0.3,0.3));
  bigText(last?'さいごの ウェーブ！':`ウェーブ ${n}`);sfx(330,0.3,'sawtooth',0.05,440);
}
function explode(a){
  burst(a.tx,a.ty-10,'#ffb347',14,220,6);burst(a.tx,a.ty-10,'#777777',8,140,6);sfx(90,0.25,'sawtooth',0.07,40);G.shake=Math.max(G.shake,0.12);
  for(const e of G.enemies.slice())if(!e.fly&&!e.dead&&dist(e.x,e.y,a.tx,a.ty)<a.rad+e.r*0.6)hurt(e,a.dmg,a.tx,a.ty,'cannon');
}

const joy={active:false,id:null,ox:0,oy:0,cx:0,cy:0};
function lp(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}

  const dx=x-joy.ox,dy=y-joy.oy,l=Math.hypot(dx,dy);if(l>60){joy.ox=x-dx/l*60;joy.oy=y-dy/l*60;}});
const endJoy=e=>{if(e.pointerId===joy.id){joy.active=false;joy.id=null;}};

/* ---------- update ---------- */
function update(dt){
  G.t+=dt;const p=G.p,m=G.m,pc=cap();
  G.terrD+=(G.terrR-G.terrD)*Math.min(1,dt*2.5);
  let ix=0,iy=0;
  if(joy.active){const dx=joy.cx-joy.ox,dy=joy.cy-joy.oy,l=Math.hypot(dx,dy);if(l>6){const k=Math.min(1,l/45);ix=dx/l*k;iy=dy/l*k;}}
  const kx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),ky=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
  if(kx||ky){const l=Math.hypot(kx,ky);ix=kx/l;iy=ky/l;}
  const mv=Math.hypot(ix,iy),spd=230*m.speed;p.moving=mv>0.05;
  if(p.moving){p.x+=ix*spd*dt;p.y+=iy*spd*dt;p.step+=dt*12;p.moved+=spd*mv*dt;if(Math.abs(ix)>0.15)p.face=ix>0?1:-1;}
  {const dx=p.x-BX,dy=p.y-BY,d=Math.hypot(dx,dy),lim=G.terrD-16;if(d>lim){p.x=BX+dx/d*lim;p.y=BY+dy/d*lim;}}
  pushOut(p,BX,BY,BASE_R+12);
  for(const t of G.trees)if(t.alive)pushOut(p,t.x,t.y,24*t.sz);
  if(G.tut===0&&p.moved>120)G.tut=1;

  p.atkT-=dt;p.chopT-=dt;p.swing=Math.max(0,p.swing-dt*4.5);
  let foe=null,fb=70;
  for(const e of G.enemies){const d=dist(p.x,p.y,e.x,e.y)-e.r;if(d<fb){fb=d;foe=e;}}
  const pdmg=(G.axeLv>=2?2:1)+m.pdmg;
  if(foe){if(p.atkT<=0){p.atkT=0.42;p.swing=1;p.face=foe.x>=p.x?1:-1;
    if(m.area){burst(p.x,p.y-20,'#ffffff',10,200,3);for(const e of G.enemies.slice())if(dist(p.x,p.y,e.x,e.y)-e.r<75)hurt(e,pdmg,p.x,p.y,'player');}
    else hurt(foe,pdmg,p.x,p.y,'player');}}
  else{let tg=null,tb=62;
    for(const t of G.trees)if(t.alive&&dist(t.x,t.y,BX,BY)<G.terrD+20){const d=dist(p.x,p.y,t.x,t.y);if(d<tb){tb=d;tg=t;}}
    if(tg&&p.wood<pc&&p.chopT<=0){p.chopT=[0.42,0.32,0.24,0.17][G.axeLv]*m.chop;p.swing=1;p.face=tg.x>=p.x?1:-1;chop(tg);}}

  for(const t of G.trees){t.shake=Math.max(0,t.shake-dt);
    if(!t.alive){t.regrow-=dt;if(t.regrow<=0&&dist(p.x,p.y,t.x,t.y)>45){t.alive=true;t.hp=t.max;t.grow=0;}}
    else if(t.grow<1)t.grow=Math.min(1,t.grow+dt*3);}

  for(const s of G.spots){
    if(s.hidden)continue;
    s.pulse+=dt;s.pop=Math.max(0,s.pop-dt);s.hit=Math.max(0,s.hit-dt);
    s.near=dist(p.x,p.y,s.x,s.y)<40;
    const canPay=!(s.type==='tower'&&s.lv>0&&!s.kind);
    if(s.near&&canPay&&s.lv<MAXLV[s.type]&&p.wood>0){s.feed-=dt;
      if(s.feed<=0){s.feed=0.065;p.wood--;s.paid++;
        G.flyers.push({x0:p.x,y0:p.y-45,tx:s.x,ty:s.y,t:0,dur:0.25,toP:false,done:false});
        sfx(600+Math.min(s.paid,24)*25,0.04,'sine',0.035);
        if(s.paid>=COST[s.type][s.lv])completeSpot(s);}}
    else s.feed=0.2;
    if(s.type==='tower'&&s.lv>0&&s.kind){const T=TW[s.kind],i=s.lv-1;s.cd-=dt;
      if(s.cd<=0){let tg=null,tb=Infinity;
        for(const e of G.enemies){if(e.fly&&!T.air)continue;const d=dist(s.x,s.y,e.x,e.y);if(d>T.rg[i])continue;
          const sc=d+(s.kind==='ice'&&e.slow>0?120:0);if(sc<tb){tb=sc;tg=e;}}
        if(tg){s.cd=T.cd[i];const dmg=T.dmg[i]*m.tdmg;
          if(s.kind==='cannon'){G.shots.push({kind:'shell',x0:s.x,y0:s.y-84,tx:tg.x,ty:tg.y,t:0,dur:0.6,dmg,rad:T.splash[i],life:1});sfx(140,0.12,'square',0.05,80);}
          else{G.shots.push({kind:s.kind,x:s.x,y:s.y-84,tg,vx:0,vy:0,dmg,life:1.5,slow:s.kind==='ice'?T.slow[i]:0});sfx(s.kind==='ice'?1300:900,0.05,'triangle',0.025,500);}}}}
  }

  for(const a of G.shots){
    if(a.kind==='shell'){a.t+=dt;if(a.t>=a.dur){a.life=0;explode(a);}continue;}
    a.life-=dt;
    if(a.tg&&!a.tg.dead){const ty=a.tg.y-a.tg.r-(a.tg.fly?24:0),dx=a.tg.x-a.x,dy=ty-a.y,d=Math.hypot(dx,dy)||1;
      if(d<a.tg.r+4){if(a.slow)a.tg.slow=Math.max(a.tg.slow,a.slow);hurt(a.tg,a.dmg,a.x,a.y,a.kind);a.life=0;continue;}a.vx=dx/d*560;a.vy=dy/d*560;}
    else if(!a.vx&&!a.vy){a.life=0;continue;}
    a.x+=a.vx*dt;a.y+=a.vy*dt;}
  G.shots=G.shots.filter(a=>a.life>0);

  for(const e of G.enemies){if(e.dead)continue;
    e.bob+=dt*(e.fly?14:7);e.hitF=Math.max(0,e.hitF-dt);e.slow=Math.max(0,e.slow-dt);
    const decay=Math.pow(0.003,dt);e.x+=e.kx*dt;e.y+=e.ky*dt;e.kx*=decay;e.ky*=decay;
    const dx=BX-e.x,dy=BY-e.y,d=Math.hypot(dx,dy)||1,sp=e.sp*(e.slow>0?0.5:1);
    e.face=dx>=0?1:-1;
    if(e.summon){e.sumT-=dt;if(e.sumT<=0){e.sumT=7;burst(e.x,e.y-e.r,'#b07ae0',14,160,5);
      for(let i=0;i<2;i++)G.enemies.push(makeEnemy('slime',e.x+rand(-50,50),e.y+rand(-50,50),G.hpMul));}}
    let wall=null;
    if(!e.fly){const outer=WR+13+e.r;
      if(d>WR-4&&d<outer+1){const w=G.walls[secIdx(Math.atan2(-dy,-dx))];
        if(w.lv>0){wall=w;e.x=BX-dx/d*outer;e.y=BY-dy/d*outer;e.kx=0;e.ky=0;}}}
    if(wall){e.atkT-=dt;if(e.atkT<=0){e.atkT=1.1;hitWall(wall,e.dmg);}}
    else if(d>BASE_R+e.r-4){e.x+=dx/d*sp*dt;e.y+=dy/d*sp*dt;}
    else{e.atkT-=dt;if(e.atkT<=0){e.atkT=1.1;G.base.hp=Math.max(0,G.base.hp-e.dmg);G.base.hit=0.3;G.shake=Math.max(G.shake,0.2);
      sfx(120,0.15,'sawtooth',0.05,70);addText(BX+rand(-30,30),BY-110,'-'+e.dmg,'#ff5a4f');
      if(G.base.hp<=0){lose();return;}}}}
  const es=G.enemies;
  for(let i=0;i<es.length;i++)for(let j=i+1;j<es.length;j++){const a=es[i],b=es[j];if(a.fly!==b.fly)continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),mm=a.r+b.r;
    if(d<mm&&d>0.01){const k=(mm-d)/2/d;a.x-=dx*k;a.y-=dy*k;b.x+=dx*k;b.y+=dy*k;}}
  G.enemies=G.enemies.filter(e=>!e.dead);

  const mr=75*m.magnet;
  for(const d of G.drops){d.t+=dt;
    if(d.z>0||d.vz>0){d.z+=d.vz*dt;d.vz-=700*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;if(d.z<=0){d.z=0;d.vz=0;}}
    else if(d.t>0.4&&p.wood<pc&&dist(p.x,p.y,d.x,d.y)<mr){const k=Math.min(1,dt*10);d.x+=(p.x-d.x)*k;d.y+=(p.y-d.y)*k;
      if(dist(p.x,p.y,d.x,d.y)<18){d.got=true;p.wood++;pickSound();}}}
  G.drops=G.drops.filter(d=>!d.got&&d.t<40);

  if(G.phase==='prep'){G.timer-=dt;if(G.timer<=0)startWave();}
  else{if(G.toSpawn.length){G.spawnT-=dt;if(G.spawnT<=0){spawnEnemy(G.toSpawn.shift());G.spawnT=Math.max(0.35,1.0-0.05*G.wave-0.04*(G.endless?4:G.si));}}
    else if(G.enemies.length===0){
      if(!G.endless&&G.wave>=G.maxWave){win();return;}
      G.phase='prep';G.timer=DIFF[G.diff].gap;bigText('ウェーブ クリア！');
      for(const w of G.walls)if(w.lv>0)w.hp=w.max;
      if(G.endless&&G.wave%5===0)setTheme(THEME_ORDER[(G.wave/5)%THEME_ORDER.length]);
      [659,784,988].forEach((f,i)=>sfx(f,0.14,'square',0.04,null,i*0.09));}}

  for(const q of G.parts){q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;q.vx*=0.98;}
  G.parts=G.parts.filter(q=>q.t<q.life);
  for(const tx of G.texts)tx.t+=dt;G.texts=G.texts.filter(tx=>tx.t<1.1);
  for(const f of G.flyers){f.t+=dt;if(f.toP&&!f.done&&f.t>=f.dur){f.done=true;pickSound();}}
  G.flyers=G.flyers.filter(f=>f.t<f.dur);
  G.base.hit=Math.max(0,G.base.hit-dt);G.shake=Math.max(0,G.shake-dt);
  if(G.big){G.big.t-=dt;if(G.big.t<=0)G.big=null;}
  const c=camTarget(),k=Math.min(1,dt*8);G.cam.x+=(c.x-G.cam.x)*k;G.cam.y+=(c.y-G.cam.y)*k;
}

/* ---------- drawing helpers ---------- */
function ell(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fill();}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fill();}
function tri(a,b,c,d,e,f){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.lineTo(e,f);ctx.closePath();ctx.fill();}

function drawEnemy(e){

    ctx.fillStyle=e.hitF>0?'#ffffff':'#3d2a63';

    if(e.slow>0){ctx.fillStyle='rgba(140,220,255,.4)';circ(0,-r,r*1.15);}
    ctx.restore();

  const sq=1+Math.sin(e.bob)*(e.type==='wolf'?0.12:0.07);

  ctx.fillStyle='rgba(0,0,0,.2)';ell(0,2,r*1.05,r*0.35);

  if(e.type==='maou'){ctx.fillStyle='#2a1a3a';tri(-r*0.7,-r*1.5,-r*1.0,-r*2.5,-r*0.3,-r*1.75);tri(r*0.3,-r*1.75,r*1.0,-r*2.5,r*0.7,-r*1.5);}
  ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,-r*sq,r*(2-sq),r*sq,0,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ell(-r*0.4,-r*1.4*sq,r*0.26,r*0.15);
  if(e.type==='splitter'){ctx.fillStyle='rgba(255,255,255,.3)';circ(-r*0.3,-r*0.6,r*0.25);circ(r*0.1,-r*0.45,r*0.18);}
  if(e.type==='boss'||e.type==='maou'){ctx.fillStyle='#ffc928';ctx.beginPath();ctx.moveTo(-r*0.5,-r*1.75);ctx.lineTo(-r*0.55,-r*2.35);ctx.lineTo(-r*0.25,-r*2.05);ctx.lineTo(0,-r*2.45);
    ctx.lineTo(r*0.25,-r*2.05);ctx.lineTo(r*0.55,-r*2.35);ctx.lineTo(r*0.5,-r*1.75);ctx.closePath();ctx.fill();}
  if(e.type==='knight'){ctx.fillStyle=e.hitF>0?'#ffffff':'#5a6578';ctx.beginPath();ctx.arc(0,-r*1.05,r*0.98,Math.PI,0);ctx.fill();
    ctx.fillStyle='#e04a3a';ell(-r*0.1,-r*2.1,r*0.18,r*0.35);
    ctx.fillStyle='#1d2330';rr(-r*0.1,-r*1.2,r*0.95,r*0.28,r*0.1);ctx.fillStyle='#ffe066';rr(r*0.15,-r*1.12,r*0.55,r*0.1,r*0.05);}
  else{const eyeC=e.type==='maou'?'#ff3a3a':'#fff';ctx.fillStyle=eyeC;ell(r*0.15,-r*1.05,r*0.21,r*0.25);ell(r*0.62,-r*1.05,r*0.18,r*0.23);
    ctx.fillStyle='#24162e';circ(r*0.22,-r*1.0,r*0.1);circ(r*0.67,-r*1.0,r*0.09);
    if(e.type!=='slime'&&e.type!=='mini'&&e.type!=='splitter'){ctx.strokeStyle='#24162e';ctx.lineWidth=Math.max(2,r*0.09);ctx.beginPath();ctx.moveTo(-r*0.05,-r*1.42);ctx.lineTo(r*0.35,-r*1.28);ctx.moveTo(r*0.45,-r*1.28);ctx.lineTo(r*0.8,-r*1.4);ctx.stroke();}}
  if(e.slow>0){ctx.fillStyle='rgba(140,220,255,.38)';ctx.beginPath();ctx.ellipse(0,-r*sq,r*1.12,r*1.08,0,0,TAU);ctx.fill();}

function drawWallSpot(s){
  const maxed=s.lv>=2,need=maxed?0:COST.wall[s.lv],pd=dist(G.p.x,G.p.y,s.x,s.y);
  if(s.lv===0){const k=Math.floor(7*s.paid/need);
    s.posts.forEach((pp,j)=>{if(j<k){ctx.globalAlpha=0.6;drawPost(pp,1,false);ctx.globalAlpha=1;}
      else{ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(pp.x,pp.y-4,10,0,TAU);ctx.stroke();ctx.setLineDash([]);}});}
  if(s.near&&!maxed){ctx.strokeStyle='#ffcc1f';ctx.lineWidth=4;ctx.beginPath();ctx.arc(s.x,s.y,26+Math.sin(s.pulse*10)*2,0,TAU);ctx.stroke();}
  if(s.lv===1&&s.paid>0){ctx.strokeStyle='#ffcc1f';ctx.lineWidth=6;ctx.beginPath();ctx.arc(s.x,s.y-10,22,-Math.PI/2,-Math.PI/2+TAU*s.paid/need);ctx.stroke();}

    costLabel(s.lv===0?'かべ':'いしの かべ',lx,ly,need-s.paid);}
}
function drawSpot(s){
  if(s.hidden)return;
  if(s.type==='wall'){drawWallSpot(s);return;}
  const maxed=s.lv>=MAXLV[s.type],need=maxed?0:COST[s.type][s.lv],pul=s.near&&!maxed?1+Math.sin(s.pulse*10)*0.06:1;

}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=G?G.th.bg:'#3d7431';ctx.fillRect(0,0,W,H);
  if(!G)return;
  if(!running&&G.state==='play'&&G.t===0)snapCam();
  const th=G.th,sh=G.shake*14,ox=sh?rand(-sh,sh):0,oy=sh?rand(-sh,sh):0;
  ctx.save();ctx.scale(S,S);ctx.translate(-G.cam.x+ox,-G.cam.y+oy);
  const vx0=G.cam.x-60,vy0=G.cam.y-40,vx1=G.cam.x+W/S+60,vy1=G.cam.y+H/S+140;
  const inView=(x,y)=>x>vx0&&x<vx1&&y>vy0&&y<vy1;
  ctx.fillStyle=th.ground;ctx.fillRect(0,0,WORLD,WORLD);
  for(const t of G.tufts)if(inView(t.x,t.y)){ctx.fillStyle=t.c;ell(t.x,t.y,t.s,t.s*0.5);}
  for(const f of G.flowers)if(inView(f.x,f.y)){ctx.fillStyle=f.c;circ(f.x,f.y,3);}
  ctx.fillStyle=th.clear;ell(BX,BY+10,250,238);
  for(const s of G.spots)drawSpot(s);
  for(const d of G.drops){ctx.fillStyle='rgba(0,0,0,.18)';ell(d.x,d.y+2,9,3);logIcon(d.x,d.y-6-d.z,18,Math.sin(d.t*3)*0.3);}
  const objs=[];
  for(const t of G.trees)if(inView(t.x,t.y))objs.push([t.y,0,t]);
  for(const e of G.enemies)objs.push([e.y,1,e]);
  for(const s of G.spots)if(s.type==='tower'&&s.lv>0)objs.push([s.y,2,s]);
  for(const w of G.walls)if(w.lv>0)for(const pp of w.posts)objs.push([pp.y,5,pp,w]);
  objs.push([BY,3,null]);objs.push([G.p.y,4,G.p]);
  objs.sort((a,b)=>a[0]-b[0]);
  for(const o of objs){const k=o[1];if(k===0)drawTree(o[2]);else if(k===1)drawEnemy(o[2]);else if(k===2)drawTower(o[2]);
    else if(k===3)drawBase();else if(k===4)drawPlayer(o[2]);else drawPost(o[2],o[3].lv,o[3].hit>0);}
  for(const w of G.walls)if(w.lv>0&&w.hp<w.max){const bw=60;ctx.fillStyle='rgba(0,0,0,.45)';rr(w.x-bw/2,w.y-52,bw,7,3.5);
    ctx.fillStyle=w.hp/w.max>0.4?'#ffcc1f':'#ff5a4f';rr(w.x-bw/2,w.y-52,Math.max(7,bw*w.hp/w.max),7,3.5);}
  for(const a of G.shots){
    if(a.kind==='shell'){const u=clamp(a.t/a.dur,0,1),x=a.x0+(a.tx-a.x0)*u,y=a.y0+(a.ty-a.y0)*u-Math.sin(u*Math.PI)*90;
      ctx.fillStyle='rgba(0,0,0,.18)';ell(a.x0+(a.tx-a.x0)*u,a.ty+(a.y0+84-a.ty)*(1-u),5,2);ctx.fillStyle='#2e3238';circ(x,y,6);continue;}
    if(a.kind==='ice'){ctx.fillStyle='#bff0ff';circ(a.x,a.y,5);ctx.fillStyle='#ffffff';circ(a.x-1,a.y-1,2);continue;}
    const l=Math.hypot(a.vx,a.vy)||1;ctx.strokeStyle='#6b4423';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(a.x-a.vx/l*14,a.y-a.vy/l*14);ctx.stroke();ctx.fillStyle='#ffffff';circ(a.x,a.y,2.5);}
  for(const q of G.parts){ctx.globalAlpha=Math.max(0,1-q.t/q.life);ctx.fillStyle=q.col;ctx.fillRect(q.x-q.sz/2,q.y-q.sz/2,q.sz,q.sz);}
  ctx.globalAlpha=1;
  ctx.fillStyle=th.fog;ctx.beginPath();ctx.rect(vx0-200,vy0-200,(vx1-vx0)+400,(vy1-vy0)+400);ctx.arc(BX,BY,G.terrD,0,TAU,true);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=3;ctx.setLineDash([14,10]);ctx.beginPath();ctx.arc(BX,BY,G.terrD,0,TAU);ctx.stroke();ctx.setLineDash([]);
  if(th.tint){ctx.fillStyle=th.tint;ctx.fillRect(vx0-200,vy0-200,(vx1-vx0)+400,(vy1-vy0)+400);}
  const p=G.p;
  for(const f of G.flyers){if(f.t<0)continue;const tt=clamp(f.t/f.dur,0,1),tx=f.toP?p.x-12*p.face:f.tx,ty=f.toP?p.y-40-Math.min(p.wood,32)*5:f.ty;
    logIcon(f.x0+(tx-f.x0)*tt,f.y0+(ty-f.y0)*tt-Math.sin(tt*Math.PI)*50,16,tt*6);}
  for(const tx of G.texts){ctx.globalAlpha=Math.max(0,1-Math.pow(tx.t/1.1,2));otext(tx.s,tx.x,tx.y-tx.t*40,18,tx.col);}
  ctx.globalAlpha=1;
  ctx.restore();
  drawHUD();
}
function drawHUD(){

  ctx.fillStyle='rgba(0,0,0,.32)';rr(10,10,138*u,46*u,16*u);
  logIcon(32*u+4,33*u,24*u);
  otext(`${p.wood} / ${pc}`,52*u+4,33*u,20*u,p.wood>=pc?'#ffd84d':'#ffffff','left');
  ctx.fillStyle='rgba(0,0,0,.32)';rr(10,62*u,138*u,30*u,12*u);
  otext(`Lv ${G.lv}`,18*u,77*u,15*u,'#ffd84d','left');
  const xw=70*u;ctx.fillStyle='rgba(255,255,255,.25)';rr(66*u,72*u,xw,10*u,5*u);ctx.fillStyle='#7fe08a';rr(66*u,72*u,Math.max(4,xw*G.xp/xpNeed(G.lv)),10*u,5*u);
  otext(`${G.endless?'むげん':'ステージ '+(G.si+1)}・${DIFF[G.diff].name}`,14,108*u,13*u,'#ffffff','left');
  const cx=W/2;
  const s1=G.phase==='prep'?(G.wave===0?`てきが くるまで ${Math.ceil(G.timer)}`:`つぎの てきまで ${Math.ceil(G.timer)}`):(G.endless?`ウェーブ ${G.wave}`:`ウェーブ ${G.wave} / ${G.maxWave}`);
  otext(s1,cx,26*u,19*u,'#ffffff');
  const bw=170*u,bh=13*u,by=46*u,b=G.base;
  ctx.font=`${16*u}px ${FONT}`;ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText('🏠',cx-bw/2-4,by+bh/2);
  ctx.fillStyle='rgba(0,0,0,.4)';rr(cx-bw/2,by,bw,bh,bh/2);
  ctx.fillStyle=b.hp/b.max>0.4?'#5bd16a':'#ff5a4f';if(b.hp>0)rr(cx-bw/2,by,Math.max(bh,bw*b.hp/b.max),bh,bh/2);
  if(G.phase==='fight'){const left=G.toSpawn.length+G.enemies.length;otext(`のこり ${left}`,cx,by+bh+16*u,14*u,'#ffd0c8');}
  for(const e of G.enemies){const sx=(e.x-G.cam.x)*S,sy=(e.y-e.r-G.cam.y)*S;if(sx>-10&&sx<W+10&&sy>-10&&sy<H+10)continue;
    const dx=sx-W/2,dy=sy-H/2,m=Math.min((W/2-26)/Math.max(Math.abs(dx),1e-3),(H/2-26)/Math.max(Math.abs(dy),1e-3));
    const ix=W/2+dx*m,iy=H/2+dy*m,a=Math.atan2(dy,dx);
    ctx.save();ctx.translate(ix,iy);ctx.rotate(a);ctx.fillStyle=(e.type==='boss'||e.type==='maou')?'#ffcc1f':'#ff4d4d';ctx.strokeStyle='#fff';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-8,-9);ctx.lineTo(-8,9);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
  const hints=['がめんを ゆびで なぞって あるこう','きの そばに いくと きを きるよ','まるの うえに たつと たてものが できるよ'];
  let hint=null;if(G.tut<3)hint=hints[G.tut];else if(G.wave===0&&G.st.tip)hint=G.st.tip;
  if(hint&&running){ctx.font=`800 ${17*u}px ${FONT}`;const tw=Math.min(W-20,ctx.measureText(hint).width+36*u);
    ctx.fillStyle='rgba(0,0,0,.45)';rr(W/2-tw/2,H-80*u,tw,44*u,22*u);otext(hint,W/2,H-58*u,17*u,'#ffffff');}
  if(G.big){const t=G.big.t,a=Math.min(1,t/0.4),sc=1+Math.max(0,(t-1.6))*1.2;ctx.globalAlpha=a;
    ctx.save();ctx.translate(W/2,H*0.36);ctx.scale(sc,sc);otext(G.big.s,0,0,36*u,'#ffd84d');ctx.restore();ctx.globalAlpha=1;}
  if(joy.active){ctx.globalAlpha=0.35;ctx.fillStyle='#ffffff';circ(joy.ox,joy.oy,52);ctx.globalAlpha=0.85;
    const dx=joy.cx-joy.ox,dy=joy.cy-joy.oy,l=Math.hypot(dx,dy)||1,m=Math.min(l,45);circ(joy.ox+dx/l*m,joy.oy+dy/l*m,22);ctx.globalAlpha=1;}
}

/* ---------- screens ---------- */
function hideHud(){pauseBtn.style.display='none';callBtn.style.display='none';callBtn._v=false;}
function setOverlay(html){card.innerHTML=html;ov.classList.remove('hide');hideHud();card.scrollTop=0;}
function bind(id,fn){const el=document.getElementById(id);if(el)el.onclick=fn;}
function resume(){initAudio();ov.classList.add('hide');pauseBtn.style.display='';running=true;last=performance.now();}
function showTitle(){
  setOverlay(`<div class="title">もりの まもりびと</div>
  <p class="lead">きを きって もくざいを あつめ、<br>とうと かべで おうちを まもろう！</p>
  <div class="steps">
    <div class="step"><b>👆</b>ゆびで なぞって あるく</div>
    <div class="step"><b>🌲</b>きの そばに いると、きを きる</div>
    <div class="step"><b>🏰</b>まるに たつと とう。3しゅるいから えらべる</div>
    <div class="step"><b>🪵</b>てんせんに たつと、かべが できる</div>
    <div class="step"><b>⭐</b>レベルアップで パワーアップを えらぶ</div>
    <div class="step"><b>🚩</b>りょうちを ひろげると、きと とうが ふえる</div>
  </div>
  <div class="btns"><button class="btn" id="go">あそぶ</button></div>`);
  bind('go',()=>{initAudio();showSelect();});
}
function showSelect(){
  const pr=loadProg();
  const rows=STAGES.map((s,i)=>{const lock=i+1>pr.unlocked;
    return `<button class="sbtn" data-i="${i}" ${lock?'disabled':''}><span class="sw" style="background:${s.sw}">${lock?'🔒':i+1}</span><span class="nm">${s.name}</span><span class="st">${lock?'':(pr.crown[i]?'👑':'')+'★'.repeat(pr.stars[i])+'☆'.repeat(3-pr.stars[i])}</span></button>`;}).join('');
  const eLock=pr.unlocked<4;
  const endless=`<button class="sbtn" id="endless" ${eLock?'disabled':''}><span class="sw" style="background:#7a4ad8">${eLock?'🔒':'∞'}</span><span class="nm">むげんモード</span><span class="st">${eLock?'ステージ3 クリアで':'さいこう '+pr.endless}</span></button>`;
  const diffs=DIFF.map((d,i)=>`<button class="dbtn ${pr.diff===i?'on':''}" data-d="${i}">${d.name}</button>`).join('');
  setOverlay(`<div class="title">ステージを えらぼう</div><div class="diff">${diffs}</div><p class="small">むずかしいで クリアすると 👑</p>
    <div class="stages">${rows}${endless}</div><button class="btn2" id="back">もどる</button>`);
  card.querySelectorAll('.dbtn').forEach(b=>{b.onclick=()=>{const v=loadProg();v.diff=+b.dataset.d;saveProg(v);showSelect();};});
  card.querySelectorAll('.sbtn[data-i]').forEach(b=>{b.onclick=()=>startStage(+b.dataset.i,false);});
  bind('endless',()=>startStage(0,true));
  bind('back',showTitle);
}
function startStage(si,endless){initAudio();const pr=loadProg();newGame(si,pr.diff,!!endless);ov.classList.add('hide');pauseBtn.style.display='';running=true;last=performance.now();bigText(G.st.name);}
function showPause(){
  if(!G||G.state!=='play'||!running)return;running=false;
  setOverlay(`<div class="title">ひとやすみ</div><p class="lead">${G.endless?'むげんモード':'ステージ '+(G.si+1)+'「'+G.st.name+'」'}<br>Lv ${G.lv}・${DIFF[G.diff].name}</p>
    <div class="btns"><button class="btn" id="resume">つづける</button><button class="btn2" id="sel">ステージを えらぶ</button></div>`);
  bind('resume',resume);bind('sel',showSelect);
}
pauseBtn.addEventListener('click',showPause);
// pause automatically when the iPad switches apps / locks, so the house isn't attacked while away
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(joy.active){joy.active=false;joy.id=null;}showPause();}});
addEventListener('pagehide',showPause);
callBtn.addEventListener('click',()=>{if(G&&running&&G.phase==='prep'){const bonus=Math.ceil(G.timer/4);if(bonus>0){gainXP(bonus);addText(G.p.x,G.p.y-80,`けいけんち +${bonus}`,'#7fe08a');}G.timer=0;}});
function pickPerks(){
  const av=PERKS.filter(p=>(G.perkCount[p.id]||0)<p.max&&p.id!=='heal');shuffle(av);
  const out=av.slice(0,3);
  if(out.length<3||G.base.hp<G.base.max*0.5)out[Math.min(out.length,2)]=PERKS.find(p=>p.id==='heal');
  return out.slice(0,3);
}
function openModal(md){
  running=false;
  if(md.type==='tower'){
    setOverlay(`<div class="title">どの とうに する？</div><div class="opts">${Object.keys(TW).map(k=>`<button class="opt" data-k="${k}"><b>${TW[k].ic}</b><span><span class="on1">${TW[k].name}</span><span class="d">${TW[k].desc}</span></span></button>`).join('')}</div>`);
    card.querySelectorAll('.opt').forEach(b=>{b.onclick=()=>{md.s.kind=b.dataset.k;md.s.cd=0.3;addText(md.s.x,md.s.y-120,TW[md.s.kind].name+'が できた！','#ffffff');resume();};});
  }else{
    const opts=pickPerks();
    setOverlay(`<div class="title">レベルアップ！</div><p class="lead">Lv ${G.lv}　パワーアップを 1つ えらぼう</p><div class="opts">${opts.map((p,i)=>`<button class="opt" data-i="${i}"><b>${p.ic}</b><span><span class="on1">${p.name}</span><span class="d">${p.d}</span></span></button>`).join('')}</div>`);
    card.querySelectorAll('.opt').forEach(b=>{b.onclick=()=>{const p=opts[+b.dataset.i];p.f(G.m);G.perkCount[p.id]=(G.perkCount[p.id]||0)+1;resume();};});
  }
}
function win(){
  G.state='win';running=false;hideHud();
  const r=G.base.hp/G.base.max,st=r>=0.7?3:r>=0.4?2:1,si=G.si;
  const pr=loadProg();pr.stars[si]=Math.max(pr.stars[si],st);if(G.diff===2)pr.crown[si]=true;
  pr.unlocked=Math.min(STAGES.length,Math.max(pr.unlocked,si+2));saveProg(pr);
  [523,659,784,1047,1319].forEach((f,i)=>sfx(f,0.2,'square',0.05,null,i*0.12));
  const lastStage=si===STAGES.length-1;
  setTimeout(()=>{setOverlay(`<div class="title">${lastStage?'ぜんぶ クリア！':'クリア！'}</div><div class="stars">${G.diff===2?'👑':''}${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>
    <p class="lead">${lastStage?'まおうを たおして もりを まもった！<br>':'おうちを まもりきったよ！<br>'}おうちの げんき ${G.base.hp} / ${G.base.max}　Lv ${G.lv}</p>
    <div class="btns">${lastStage?'':'<button class="btn" id="next">つぎの ステージへ</button>'}<button class="${lastStage?'btn':'btn2'}" id="sel">ステージを えらぶ</button></div>`);
    bind('next',()=>startStage(si+1,false));bind('sel',showSelect);},900);
}
function lose(){
  G.state='over';running=false;hideHud();const si=G.si,endless=G.endless;
  [392,330,262].forEach((f,i)=>sfx(f,0.3,'triangle',0.06,null,i*0.2));
  let rec='';
  if(endless){const pr=loadProg();const best=pr.endless;if(G.wave>best){pr.endless=G.wave;saveProg(pr);rec='<br>🎉 さいこう きろく こうしん！';}}
  setTimeout(()=>{setOverlay(`<div class="title">${endless?'おつかれさま！':'ざんねん…'}</div><p class="lead">${endless?`ウェーブ ${G.wave} まで たどりついた！${rec}`:`おうちが こわされちゃった。<br>ウェーブ ${G.wave} まで がんばったね！`}</p>
    <p class="lead" style="font-size:16px">ヒント：かべで とめて、こおりで おそく、たいほうで まとめて たおそう</p>
    <div class="btns"><button class="btn" id="retry">もういちど</button><button class="btn2" id="sel">ステージを えらぶ</button></div>`);
    bind('retry',()=>startStage(si,endless));bind('sel',showSelect);},900);
}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(G&&running){update(dt);if(running&&G.state==='play'&&G.modal.length)openModal(G.modal.shift());}
  const want=!!(G&&running&&G.state==='play'&&G.phase==='prep');if(callBtn._v!==want){callBtn.style.display=want?'':'none';callBtn._v=want;}
  draw();requestAnimationFrame(loop);}
window.__mori={get G(){return G;},startStage,update:dt=>update(dt),draw:()=>draw(),openModal:md=>openModal(md),pickPerks:()=>pickPerks()};
newGame(0,1,false);showTitle();requestAnimationFrame(loop);
})();
</script>
